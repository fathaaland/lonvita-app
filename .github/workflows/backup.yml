name: Database backup

# A copy of the production database outside Neon (whose own point-in-time restore covers only its
# plan's history window, and nothing if the project itself is lost): every night a pg_dump,
# encrypted before it leaves the runner, into a bucket of its own. Every week the newest one is
# restored into an empty Postgres and checked — a backup nobody has restored is a hope, not a backup.
#
# Repository secrets:
#   BACKUP_DATABASE_URL     production DATABASE_URL_UNPOOLED (direct, not the -pooler host), read-only role if possible
#   BACKUP_PASSPHRASE       long random passphrase; keep a copy outside GitHub — without it the dumps are unreadable
#   BACKUP_S3_BUCKET        bucket for the dumps (versioning on, lifecycle rule e.g. 90 days, not the media bucket)
#   BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY / BACKUP_S3_REGION, BACKUP_S3_ENDPOINT (non-AWS only)
#   SENTRY_DSN              the app's Sentry DSN — each run checks in with a Sentry cron monitor, so a backup that
#                           never ran (GitHub disables schedules in a public repo after 60 days without a push,
#                           or just drops a run) alerts too, not only one that failed. Unset = no check-in.
# Repository variable (optional):
#   BACKUP_PG_MAJOR         pg_dump's major version — at least the server's (default 18 — Neon runs 18)

on:
  schedule:
    - cron: '15 1 * * *' # nightly, 01:15 UTC
    - cron: '45 2 * * 0' # Sunday: restore test of the newest dump
  workflow_dispatch:
    inputs:
      restore_test:
        description: 'Run the restore test instead of a backup'
        type: boolean
        default: false

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  PG_MAJOR: ${{ vars.BACKUP_PG_MAJOR || '18' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
  BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
  S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}

jobs:
  backup:
    if: github.event.schedule != '45 2 * * 0' && !inputs.restore_test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Dump, encrypt, upload
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          key="postgres/$(date -u +%Y/%m)/lonvita-$(date -u +%Y%m%dT%H%M%SZ).dump.gpg"
          endpoint=${S3_ENDPOINT:+--endpoint-url "$S3_ENDPOINT"}
          # Custom format (pg_restore can pick tables out of it), no owners/grants — restorable into
          # any database. Streamed: the plain dump never touches the runner's disk.
          docker run --rm -e DATABASE_URL "postgres:${PG_MAJOR}-alpine" \
              sh -c 'pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL"' \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" \
            | aws s3 cp - "s3://$BUCKET/$key" $endpoint --expected-size 10000000000
          size=$(aws s3api head-object --bucket "$BUCKET" --key "$key" $endpoint --query ContentLength --output text)
          echo "Uploaded s3://$BUCKET/$key ($size bytes)"
          # An empty or tiny file means pg_dump failed half-way — fail loudly instead of "backed up".
          if [ "$size" -lt 10000 ]; then echo "::error::Backup suspiciously small ($size bytes)"; exit 1; fi

      # GitHub starts scheduled runs hours late, so the margin is wide; a night with no run at all still alerts.
      - name: Sentry cron check-in
        if: always()
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STATUS: ${{ job.status == 'success' && 'ok' || 'error' }}
        run: |
          [ -n "$SENTRY_DSN" ] || { echo "::warning::SENTRY_DSN secret not set — no cron check-in"; exit 0; }
          key=$(echo "$SENTRY_DSN" | sed -E 's#^https://([^@]+)@.*#\1#')
          host=$(echo "$SENTRY_DSN" | sed -E 's#^https://[^@]+@([^/]+)/.*#\1#')
          project=$(echo "$SENTRY_DSN" | sed -E 's#.*/([0-9]+)$#\1#')
          jq -n --arg status "$STATUS" '{status: $status, environment: "production", monitor_config: {
                schedule: {type: "crontab", value: "15 1 * * *"}, timezone: "UTC",
                checkin_margin: 720, max_runtime: 60, failure_issue_threshold: 1, recovery_threshold: 1 }}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- \
                "https://$host/api/$project/cron/lonvita-database-backup/$key/" || echo "::warning::Sentry check-in failed"

  restore-test:
    if: github.event.schedule == '45 2 * * 0' || inputs.restore_test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U restore -d restore"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Download, decrypt and restore the newest dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          endpoint=${S3_ENDPOINT:+--endpoint-url "$S3_ENDPOINT"}
          read -r key modified < <(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix postgres/ $endpoint \
            --query 'sort_by(Contents, &LastModified)[-1].[Key, LastModified]' --output text)
          if [ -z "$key" ] || [ "$key" = "None" ]; then echo "::error::No backup found"; exit 1; fi
          # A restore that works on a weeks-old dump proves nothing about last night — the nightly job
          # may have stopped (schedule disabled, secret expired) without a single failed run.
          age_hours=$(( ( $(date -u +%s) - $(date -u -d "$modified" +%s) ) / 3600 ))
          echo "Restoring $key (uploaded $modified, ${age_hours} h ago)"
          if [ "$age_hours" -gt 48 ]; then echo "::error::Newest backup is ${age_hours} h old — the nightly backup isn't running"; exit 1; fi
          aws s3 cp "s3://$BUCKET/$key" - $endpoint \
            | gpg --batch --decrypt --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" > restore.dump
          docker run --rm --network host -v "$PWD:/work" -e PGPASSWORD=restore "postgres:${PG_MAJOR}-alpine" \
            pg_restore --no-owner --no-acl --exit-on-error -h localhost -U restore -d restore /work/restore.dump
      - name: The restored database holds what it should
        env:
          PGPASSWORD: restore
        run: |
          set -euo pipefail
          q() { docker run --rm --network host -e PGPASSWORD "postgres:${PG_MAJOR}-alpine" psql -h localhost -U restore -d restore -tAc "$1"; }
          echo "Tables: $(q "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")"
          users=$(q "SELECT count(*) FROM users")
          events=$(q "SELECT count(*) FROM events")
          migrations=$(q "SELECT count(*) FROM payload_migrations")
          echo "users=$users events=$events migrations=$migrations"
          if [ "$users" -lt 1 ] || [ "$migrations" -lt 1 ]; then echo "::error::Restored database is empty"; exit 1; fi
          # The app writes audit entries every night (data retention, the audit export) — a dump whose
          # newest one is days old was taken from a stale or wrong database.
          newest=$(q "SELECT max(created_at) FROM audit_log")
          lag=$(q "SELECT coalesce(floor(extract(epoch FROM now() - max(created_at)) / 3600), 99999)::int FROM audit_log")
          echo "Newest audit-log entry in the dump: $newest (${lag} h ago)"
          if [ "$lag" -gt 72 ]; then echo "::error::Newest audit-log entry in the dump is ${lag} h old"; exit 1; fi

  # Data loss is the incident nobody notices until it's too late — a failed backup or restore drill
  # goes straight to the platform team's Discord (the same webhook as lib/alerts/ops).
  alert-on-failure:
    needs: [backup, restore-test]
    if: always() && (needs.backup.result == 'failure' || needs.restore-test.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Discord
        env:
          WEBHOOK: ${{ secrets.OPS_DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHICH: ${{ needs.backup.result == 'failure' && 'Záloha databáze' || 'Test obnovy zálohy' }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::OPS_DISCORD_WEBHOOK_URL secret not set"; exit 0; fi
          jq -n --arg which "$WHICH" --arg url "$RUN_URL" '{
            username: "Lonvita alerts",
            allowed_mentions: { parse: [] },
            content: "🚨 **Kritický alert**",
            embeds: [{ title: ($which + " selhala"), url: $url, color: 14427686,
                       description: "Hrozí ztráta dat — zkontrolovat běh workflow." }]
          }' | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
