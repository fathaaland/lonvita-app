services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: lonvita
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d lonvita']
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/lonvita-media &&
      mc anonymous set download local/lonvita-media &&
      echo 'Bucket lonvita-media ready.'
      "

  # Consumes the BullMQ 'lonvita' queue (send-email/send-sms jobs — see src/lib/queue/) and owns
  # the nightly notification-cleanup schedule. Without this service nothing processes what the
  # app enqueues, so Resend emails and httpSMS texts get queued but never actually sent, and
  # notifications are never pruned.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      # Host .env points these at localhost (for `pnpm dev`); inside the compose network they
      # have to resolve to the service names instead.
      - REDIS_URL=redis://valkey:6379
      # The cleanup job needs Payload, so the worker carries a DB connection now — it used to
      # talk to nothing but Redis, Resend and httpSMS.
      - DATABASE_URI=postgresql://payload:payload@postgres:5432/lonvita
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  valkey_data:
  minio_data:
