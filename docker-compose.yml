services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: lonvita
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d lonvita']
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # MinIO stopped publishing community images (quay.io/minio/* returns 401, minio/minio is gone
    # from Docker Hub). pgsty/minio is a maintained drop-in rebuild. Keep these pinned — no :latest.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/lonvita-media &&
      mc anonymous set download local/lonvita-media &&
      echo 'Bucket lonvita-media ready.'
      "

  # Consumes the BullMQ 'lonvita' queue (e-mail/SMS, feedback prompts, report exports — see src/lib/queue/) and owns
  # the nightly notification/export cleanup schedules. Without this service nothing processes what the
  # app enqueues, so Resend emails and httpSMS texts get queued but never actually sent, and
  # notifications are never pruned.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      # Host .env points these at localhost (for `pnpm dev`); inside the compose network they
      # have to resolve to the service names instead.
      - REDIS_URL=redis://valkey:6379
      # The cleanup job needs Payload, so the worker carries a DB connection now — it used to
      # talk to nothing but Redis, Resend and httpSMS.
      - DATABASE_URI=postgresql://payload:payload@postgres:5432/lonvita
      # Rendered exports are uploaded straight to the bucket (the app then presigns downloads
      # against the host's localhost:9000, which is fine — it only signs, never connects).
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  valkey_data:
  minio_data:
